        // We will create lightweight functional components that render SVG using Lucide data

            const iconData = lucide.icons[name];
            if (!iconData) return null;
            
            // Create the SVG markup using Lucide's icon data
            const svgAttrs = {
                xmlns: "http://www.w3.org/2000/svg",
                width: "24",
                height: "24",
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: "2",
                strokeLinecap: "round",
                strokeLinejoin: "round",
                ...iconData.attrs
            };

            return (
                <svg className={`lucide lucide-${name} ${className || ''}`} {...svgAttrs} dangerouslySetInnerHTML={{ __html: iconData.reduce((acc, [tag, attrs]) => {
                    const attrString = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ');
                    return acc + `<${tag} ${attrString} />`;
                }, '') }} />
            );
